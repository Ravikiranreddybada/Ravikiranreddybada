<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" role="img" aria-labelledby="title description">
  <title id="title">Bada Ravi Kiran Reddy, AI/ML Engineer</title>
  <desc id="description">Production AI systems grounded in evidence</desc>
  <defs>
    <linearGradient id="surface" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B0F15"/>
      <stop offset="1" stop-color="#111A28"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#253044" stroke-width="1" opacity="0.38"/>
    </pattern>
  </defs>
  <rect width="1200" height="360" rx="18" fill="url(#surface)"/>
  <rect width="1200" height="360" rx="18" fill="url(#grid)"/>
  <rect x="0" y="0" width="9" height="360" rx="4.5" fill="#71A2FF"/>

  <text x="68" y="78" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="600" letter-spacing="2" fill="#71A2FF">AI/ML ENGINEER  /  PRODUCTION SYSTEMS</text>
  <text x="66" y="151" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="56" font-weight="750" letter-spacing="-2" fill="#EDF2F7">Bada Ravi Kiran Reddy</text>
  <text x="68" y="204" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="25" font-weight="500" fill="#B6C2D2">I build AI systems that can show their evidence.</text>
  <text x="68" y="249" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" fill="#7F8DA0">REAL-TIME VISION  /  GROUNDED AGENTS  /  FORECASTING  /  DIGITAL TWINS</text>
  <text x="68" y="307" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="#A8B4C4">BLP Industry.AI  |  NIIT University  |  Bengaluru</text>

  <g transform="translate(850 58)">
    <text x="0" y="0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#6F7D90">ENGINEERING CONTRACT</text>
    <rect x="0" y="24" width="286" height="56" rx="10" fill="#141E2D" stroke="#2A3850"/>
    <text x="18" y="59" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#DCE5F2">01  observe the system</text>
    <path d="M143 80V102" stroke="#71A2FF" stroke-width="2"/>
    <rect x="0" y="102" width="286" height="56" rx="10" fill="#141E2D" stroke="#2A3850"/>
    <text x="18" y="137" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#DCE5F2">02  trace the evidence</text>
    <path d="M143 158V180" stroke="#71A2FF" stroke-width="2"/>
    <rect x="0" y="180" width="286" height="56" rx="10" fill="#172A4B" stroke="#71A2FF"/>
    <text x="18" y="215" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="700" fill="#AFC9FF">03  ship the decision</text>
  </g>
</svg>
