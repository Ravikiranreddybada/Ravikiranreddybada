<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" role="img" aria-labelledby="t d">
  <title id="t">Ravi Kiran Reddy</title>
  <desc id="d">AI engineer building agentic systems and data pipelines</desc>
  <defs>
    <linearGradient id="rkBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10070C"/>
      <stop offset="0.55" stop-color="#190B12"/>
      <stop offset="1" stop-color="#451126"/>
    </linearGradient>
    <linearGradient id="rkLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#701A3D"/>
      <stop offset="0.5" stop-color="#C77B9B"/>
      <stop offset="1" stop-color="#E5B5C7"/>
    </linearGradient>
    <radialGradient id="rkGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#C77B9B" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#C77B9B" stop-opacity="0"/>
    </radialGradient>
    <pattern id="rkGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#E5B5C7" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
    <filter id="rkBlur" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="6"/></filter>
  </defs>
  <rect width="1200" height="360" fill="url(#rkBg)"/>
  <rect width="1200" height="360" fill="url(#rkGrid)"/>
  <circle cx="980" cy="120" r="220" fill="url(#rkGlow)">
    <animate attributeName="cx" values="900;1060;900" dur="14s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.7;1;0.7" dur="7s" repeatCount="indefinite"/>
  </circle>
  <g fill="none" stroke="#C77B9B" stroke-opacity="0.35" stroke-width="1">
    <circle cx="990" cy="180" r="70"/>
    <circle cx="990" cy="180" r="120" stroke-dasharray="3 9"/>
    <circle cx="990" cy="180" r="170" stroke-opacity="0.18"/>
  </g>
  <g>
    <circle r="5" fill="#E5B5C7">
      <animateMotion dur="12s" repeatCount="indefinite" path="M990,60 a120,120 0 1,1 -0.1,0"/>
    </circle>
    <circle r="3.5" fill="#C77B9B">
      <animateMotion dur="20s" repeatCount="indefinite" path="M990,10 a170,170 0 1,0 0.1,0"/>
    </circle>
  </g>
  <path d="M60 300 C 260 240, 380 330, 560 280 S 860 250, 1140 300" fill="none" stroke="url(#rkLine)" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="1400" stroke-dashoffset="1400">
    <animate attributeName="stroke-dashoffset" from="1400" to="0" dur="3.5s" fill="freeze"/>
  </path>
  <path d="M60 300 C 260 240, 380 330, 560 280 S 860 250, 1140 300" fill="none" stroke="#C77B9B" stroke-width="6" stroke-opacity="0.35" filter="url(#rkBlur)" stroke-dasharray="1400" stroke-dashoffset="1400">
    <animate attributeName="stroke-dashoffset" from="1400" to="0" dur="3.5s" fill="freeze"/>
  </path>
  <text x="60" y="92" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" letter-spacing="4" fill="#C77B9B">AI ENGINEER  ·  DATA  ·  AGENTIC SYSTEMS</text>
  <text x="60" y="176" font-family="Georgia, 'Times New Roman', serif" font-size="68" font-weight="700" fill="#F8F0F3">Ravi Kiran Reddy</text>
  <rect x="62" y="196" width="200" height="3" rx="1.5" fill="url(#rkLine)">
    <animate attributeName="width" values="40;300;40" dur="6s" repeatCount="indefinite"/>
  </rect>
  <text x="60" y="238" font-family="Georgia, 'Times New Roman', serif" font-size="24" fill="#E5B5C7">I build agents, data pipelines and 3D dashboards that run on real client data.</text>
  <text x="60" y="340" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" letter-spacing="2" fill="#F8F0F3" fill-opacity="0.6">DATA SCIENCE INTERN @ BLP INDUSTRY.AI  ·  B.TECH CSE (AI &amp; ML) @ NIIT UNIVERSITY</text>
</svg>
